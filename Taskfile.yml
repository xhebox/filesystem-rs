version: '3'

vars:
  # The archive's name as `build.rs` spells it. go-task's OS and ARCH are Go's.
  HOST_RUST_OS: '{{if eq OS "darwin"}}macos{{else}}{{OS}}{{end}}'
  HOST_RUST_ARCH: '{{if eq ARCH "amd64"}}x86_64{{else if eq ARCH "arm64"}}aarch64{{else}}{{ARCH}}{{end}}'
  DIR: '{{.ROOT_DIR}}/target/juicefs-sys'
  ARCHIVE: '{{.DIR}}/libjuicefs-{{.HOST_RUST_OS}}-{{.HOST_RUST_ARCH}}.a'
  TARGETS: x86_64-unknown-linux-musl aarch64-unknown-linux-musl aarch64-apple-darwin x86_64-pc-windows-msvc aarch64-linux-android

tasks:
  check:
    desc: "Format and lint every target"
    cmds:
      - cargo fmt --all --check
      - for: { var: TARGETS }
        task: check-target
        vars: { TARGET: '{{.ITEM}}' }

  check-target:
    internal: true
    cmds:
      - cargo clippy --all-targets --locked --target {{.TARGET}} {{.CLI_ARGS}}

  test:
    desc: "Run every test on the host"
    deps: [juicefs]
    cmds:
      - cargo nextest run --locked {{.CLI_ARGS}}

  juicefs:
    desc: "Install the JuiceFS c-archive into target/juicefs-sys"
    vars:
      TARGET_OS: '{{default OS .TARGET_OS}}'
    cmds:
      # Linux and Android build in the container: Linux for musl's `cc`, Android for the NDK's.
      - cmd: docker build --build-arg TARGET_OS={{.TARGET_OS}} --target artifact --output 'type=local,dest={{.DIR}}' crates/juicefs-sys
        platforms: [linux]
      # macOS and Windows build on the host, with cgo's own C compiler.
      - cmd: |
          set -eu
          mkdir -p tmp '{{.DIR}}'
          (cd crates/juicefs-sys/binding && CGO_ENABLED=1 go build -buildmode=c-archive -trimpath -ldflags="-w -X=runtime.godebugDefault=asyncpreemptoff=1" -tags=netgo,osusergo,nogspt -o '{{.ROOT_DIR}}/tmp/libjuicefs.a' .)
          rm -f tmp/libjuicefs.h '{{.ARCHIVE}}'
          # Strip the constructor, rename Go's entry point, and localize symbols.
          if [ '{{OS}}' = darwin ]; then
            entry="__rt0_{{ARCH}}_darwin_lib"
            objcopy=llvm-objcopy
            command -v llvm-objcopy >/dev/null 2>&1 || objcopy="$(rustc --print target-libdir)/../bin/llvm-objcopy"
            "$objcopy" --remove-section=__DATA,__mod_init_func \
              --globalize-symbol="$entry" \
              --globalize-symbol=_juicefs_rt0 \
              --redefine-sym "$entry=_juicefs_rt0" \
              tmp/libjuicefs.a
            # ld-classic asserts on Go's relocation addends; use ld-prime.
            cc -r -nostdlib -Wl,-ld_new -Wl,-all_load tmp/libjuicefs.a -o tmp/juicefs.o
            "$objcopy" --strip-debug --wildcard --keep-global-symbol='_juicefs_*' tmp/juicefs.o
          else
            entry="_rt0_{{ARCH}}_windows_lib"
            objcopy --remove-section=.ctors \
              --redefine-sym "$entry=juicefs_rt0" \
              tmp/libjuicefs.a
            # Resolve MinGW's stack probes before MSVC's link.exe runs.
            libgcc="$(gcc -print-libgcc-file-name)"
            libgcc="${libgcc%"$(printf '\r')"}"
            ld -r -dc --whole-archive tmp/libjuicefs.a \
              --no-whole-archive "$libgcc" \
              -o tmp/juicefs.o
            # MSVC rejects the unwind tables GNU ld joins here.
            objcopy --remove-section=.pdata --remove-section=.xdata \
              --strip-debug --wildcard --keep-global-symbol='juicefs_*' tmp/juicefs.o
          fi
          ar rcs '{{.ARCHIVE}}' tmp/juicefs.o
          rm -f tmp/libjuicefs.a tmp/juicefs.o
        platforms: [darwin, windows]

  generate:
    desc: "Regenerate src/raw.rs from the Go archive's C header (needs bindgen and libclang)"
    cmds:
      - cmd: |
          set -eu
          mkdir -p tmp/generate
          (cd crates/juicefs-sys/binding && CGO_ENABLED=1 go build -buildmode=c-archive -trimpath -ldflags=-w -tags=netgo,osusergo,nogspt -o '{{.ROOT_DIR}}/tmp/generate/libjuicefs.a' .)
          rm -f tmp/generate/libjuicefs.a
          bindgen tmp/generate/libjuicefs.h --allowlist-function 'juicefs_.*' --allowlist-type 'juicefs_.*' --with-derive-default --impl-debug --rust-target 1.85 --rust-edition 2024 -o crates/juicefs-sys/src/raw.rs
