[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.6"
edition = "2024"
publish = true
license = "MIT"
repository = "https://github.com/xhebox/filesystem-rs"
keywords = ["filesystem", "fuse", "vfs", "storage"]
categories = ["filesystem"]

[workspace.dependencies]
api = { package = "boxfs-api", version = "0.1.6", path = "crates/api" }
asyncband = { version = "0.7.3", features = ["oneshot"] }
completion = { package = "completion-async", version = "0.2" }
fs-core = { package = "rust-fs-core", version = "0.3.15" }
fs-erofs = { package = "rust-fs-erofs", version = "0.5.0" }
imbl = "7"
libc = "0.2"
log = { version = "0.4.34", features = ["std", "kv"] }
rustix = "1.1"

# Every crate inherits lints with `[lints] workspace = true`.
[workspace.lints.rust]
let_underscore_drop = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"

[workspace.lints.cargo]
unused_dependencies = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
disallowed_methods = "deny"
len_without_is_empty = "allow"
len_zero = "allow"
print_stderr = "deny"
print_stdout = "deny"
pub_underscore_fields = "deny"
tabs_in_doc_comments = "allow"
too_many_arguments = "allow"
wildcard_imports = "deny"
