name: Release

on:
  push:
    tags: [v*]

permissions:
  contents: read

jobs:
  dist:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        # Named as `build.rs` names them: libjuicefs-{os}-{arch}.a.
        include:
          - runs-on: ubuntu-26.04
            asset: linux-x86_64
          - runs-on: ubuntu-26.04-arm
            asset: linux-aarch64
          - runs-on: macos-26
            asset: macos-aarch64
          - runs-on: windows-2025
            asset: windows-x86_64
    steps:
      - uses: actions/checkout@v7

      - uses: arduino/setup-task@v3
        with:
          repo-token: ${{ github.token }}

      # Linux builds its archive in the container; macOS and Windows build on the host.
      - name: Install go
        if: runner.os != 'Linux'
        uses: actions/setup-go@v6
        with:
          go-version-file: crates/juicefs/binding/go.mod

      # The darwin archive's entry point is made global with llvm-objcopy, which
      # rustup's llvm-tools component provides.
      - name: Install rust
        if: runner.os == 'macOS'
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          # Leave RUSTFLAGS unset; it would override the rustflags in .cargo/config.toml.
          rustflags: ""
          cache-shared-key: cargo-${{ runner.os }}-${{ runner.arch }}

      - name: Install mingw
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: Add mingw to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\msys64\mingw64\bin'

      # cgofuse, which the VFS imports on Windows, includes WinFsp's header. Fail
      # here, where the missing header is named, rather than in the Go build.
      - name: Install WinFsp
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install winfsp -y --no-progress
          $inc = 'C:\Program Files (x86)\WinFsp\inc\fuse'
          if (-not (Test-Path (Join-Path $inc 'fuse_common.h'))) { throw "WinFsp header not found under $inc" }
          # cgo splits CGO_CFLAGS on spaces, so the path goes in as its 8.3 short form.
          $short = (New-Object -ComObject Scripting.FileSystemObject).GetFolder($inc).ShortPath -replace '\\', '/'
          Add-Content -Path $env:GITHUB_ENV -Value "CGO_CFLAGS=-I$short"

      - name: Build juicefs
        run: task juicefs

      - uses: actions/upload-artifact@v7
        with:
          name: libjuicefs-${{ matrix.asset }}
          path: target/juicefs/libjuicefs-${{ matrix.asset }}.a
          if-no-files-found: error

  release:
    needs: dist
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Compress and checksum
        run: |
          cd dist
          zstd -19 --rm libjuicefs-*.a
          sha256sum libjuicefs-*.zst > SHA256SUMS
          ls -l

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  crates-io:
    needs: release
    runs-on: ubuntu-26.04
    # Trusted publishing on crates.io names this environment, which only v* tags may deploy to.
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          # Leave RUSTFLAGS unset; it would override the rustflags in .cargo/config.toml.
          rustflags: ""
          cache: false

      - uses: rust-lang/crates-io-auth-action@v1.0.5
        id: auth

      # The whole workspace in one go: cargo publishes in dependency order and
      # waits for each crate to reach the index, so `boxfs-api` is there before
      # the crates that depend on it.
      - name: Publish
        run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
