[package]
name = "boxfs-juicefs-sys"
version = "0.1.5"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"
description = "Raw bindings to the filesystem-rs embedded JuiceFS Go archive"
links = "juicefs"
include = ["src/**", "build.rs", "README.md", "Cargo.toml"]

[build-dependencies]
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[lints]
workspace = true
